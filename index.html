<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家族みまもりSOS 動作確認</title><style>body{font:18px sans-serif;max-width:480px;margin:auto;padding:20px;background:#f5f6f8}button,a{display:block;box-sizing:border-box;width:100%;padding:18px;margin:14px 0;border:0;border-radius:12px;background:#165db4;color:white;text-align:center;text-decoration:none;font:inherit}#result{overflow-wrap:anywhere}input{box-sizing:border-box;width:100%;padding:12px;font:inherit}</style></head><body><h1>家族みまもりSOS</h1><p>動作確認専用・緊急通知は送信しません。</p><button id="gps">現在地を確認</button><p id="result" role="status"></p><label>SMSテスト用電話番号<input id="number" type="tel" autocomplete="off" placeholder="自分の電話番号"></label><button id="sms">SMS作成画面を開く</button><p>SMSは自動送信されません。電話番号はこの端末内でのみ使用します。</p><a href="tel:117">電話画面を開く（117・時報）</a><p>発信ボタンは押さないでください。119はテストに使用しません。</p><script>const $=id=>document.getElementById(id);$('gps').onclick=()=>{const r=$('result');r.textContent='取得中…';if(!navigator.geolocation){r.textContent='位置情報API非対応';return}navigator.geolocation.getCurrentPosition(p=>{r.textContent='取得成功：';const a=document.createElement('a');a.href='https://www.google.com/maps?q='+p.coords.latitude+','+p.coords.longitude;a.textContent='地図を確認';a.target='_blank';a.rel='noopener noreferrer';r.append(a)},e=>{r.textContent='取得失敗（コード '+e.code+'）：'+e.message},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};$('sms').onclick=()=>{let n=$('number').value.replace(/[\s()-]/g,'');if(!/^\+?[0-9]{6,15}$/.test(n)){alert('テスト用電話番号を入力してください');return}location.href='sms:'+n+'?body='+encodeURIComponent('【テスト】家族みまもりSOSの動作確認です。')};</script></body></html>
