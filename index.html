<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家族みまもり 接続テスト</title><style>body{font:18px sans-serif;max-width:480px;margin:auto;padding:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit}button{background:#165db4;color:white;border:0;border-radius:10px}</style><h1>家族みまもり 接続テスト</h1><p>緊急用ではありません。位置情報を登録済みの2人へメール送信します。</p><label>GASウェブアプリURL<input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label><label>認証キー<input id="key" type="password" autocomplete="off"></label><button id="gps">1. 現在地を取得</button><p id="status" role="status"></p><form id="form" method="post" target="_blank" rel="noopener"><input type="hidden" name="key" id="secret"><input type="hidden" name="lat" id="lat"><input type="hidden" name="lon" id="lon"><button id="send" disabled>2. 位置情報付きテストメールを送信</button></form><script>const $=id=>document.getElementById(id);$('gps').onclick=()=>{$('send').disabled=true;$('status').textContent='取得中…';navigator.geolocation.getCurrentPosition(p=>{$('lat').value=p.coords.latitude;$('lon').value=p.coords.longitude;$('status').textContent='現在地を取得しました';$('send').disabled=false},e=>{$('status').textContent='取得失敗：'+e.code},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};$('form').onsubmit=e=>{const u=$('url').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u)||!$('key').value){e.preventDefault();alert('URLと認証キーを確認してください');return}$('form').action=u;$('secret').value=$('key').value};</script></html>
