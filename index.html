<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家族みまもり SOS</title><style>*{box-sizing:border-box}html{background:#fff6e9}body{font:18px/1.5 system-ui,sans-serif;max-width:480px;margin:auto;padding:20px 16px 30px;color:#243447}h1{text-align:center;font-size:30px;letter-spacing:.04em;margin:8px 0 18px}h1:before{content:"♥";display:block;color:#e34c62;font-size:38px;line-height:1.2}body>p:first-of-type{background:#fff;border:2px solid #e9b54b;border-radius:18px;padding:12px 15px;font-size:16px}button{display:block;width:100%;border:2px solid transparent;border-radius:22px;padding:18px 12px;margin:12px 0;font:800 24px/1.3 system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 rgba(40,50,60,.16);min-height:68px}button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(40,50,60,.16)}button:focus-visible{outline:4px solid #172c48;outline-offset:3px}#sms,#sos{color:#fff;font-size:30px;min-height:115px}#sms{background:#b92e50}#sos{background:#a74312}#t1,#t2{background:#d9f3ef;color:#124f50;border-color:#80c9c0}#emergency{background:#fff;color:#a51c30;border:3px solid #bd2940;margin-top:22px}#status{background:#fff;border:1px solid #c9d6db;border-radius:16px;padding:12px;font-size:16px;white-space:pre-wrap}small{display:block;text-align:center;font-size:15px}input[type=hidden]{display:none}@media(max-width:340px){body{padding:12px}button{font-size:22px}}</style><h1>家族みまもり</h1><p><strong>アプリが正常に稼働しない場合は直接119番への連絡を優先してください。</strong></p><button id="sms">SOS<br>家族にSMS</button><button id="sos">SOS<br>家族にメール</button><button id="t1">長男に電話</button><button id="t2">次男に電話</button><button id="emergency">119番に電話</button><p id="status" role="status">連絡先を確認中です。</p><small>SMSは送信操作、電話は発信操作が必要です。</small><form id="form" method="post" target="sos_result"><input type="hidden" name="lat" id="lat"><input type="hidden" name="lon" id="lon"></form><script>const URL='https://script.google.com/macros/s/AKfycbxVsarErMQQdxDGhyG1zJm3tJaKtZY9EoiRe8yRhne2K-JL_yKQ0fu8VZMnjBHa1zG7JA/exec';const $=id=>document.getElementById(id);let phones=[],busy=false;function status(s){$('status').textContent=s}function valid(p){return /^\+?[0-9]{8,15}$/.test(p)}window.familySosConfig=d=>{phones=[d.phone1,d.phone2].map(x=>String(x||'').replace(/[\s()-]/g,''));status(phones.every(valid)?'連絡先を読み込みました。':'アプリが正常に稼働しない場合は直接119番への連絡を優先してください')};const sc=document.createElement('script');sc.src=URL+'?action=config';sc.onerror=()=>status('アプリが正常に稼働しない場合は直接119番への連絡を優先してください');document.head.appendChild(sc);$('form').action=URL;function gps(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject();navigator.geolocation.getCurrentPosition(p=>resolve(p.coords),reject,{enableHighAccuracy:true,timeout:12000,maximumAge:0})})}function map(p){return p?'https://www.google.com/maps?q='+p.latitude+','+p.longitude:''}async function getpos(){try{return await gps()}catch(e){return null}}$('sms').onclick=async()=>{if(busy)return;if(!phones.every(valid)||phones.length!==2)return status('アプリが正常に稼働しない場合は直接119番への連絡を優先してください');busy=true;status('現在地を取得中…');try{const p=await getpos();const body='【家族みまもり SOS】助けが必要です。連絡してください。\n'+(p?'現在地：'+map(p):'現在地を取得できませんでした。');status('SMSアプリで宛先2人を確認して送信してください。');location.href='sms:'+phones.join(',')+'?body='+encodeURIComponent(body)}finally{busy=false}};$('sos').onclick=async()=>{if(busy)return;const w=window.open('about:blank','sos_result');if(!w)return status('結果画面を開けません。メールは未送信です。');w.document.body.textContent='現在地を取得中…';busy=true;try{const p=await getpos();$('lat').value=p?p.latitude:'';$('lon').value=p?p.longitude:'';$('form').submit();status('メール送信を依頼しました。別画面の結果を確認してください。')}finally{busy=false}};for(let n=1;n<=2;n++)$('t'+n).onclick=()=>{if(!valid(phones[n-1]||''))return status('アプリが正常に稼働しない場合は直接119番への連絡を優先してください');location.href='tel:'+phones[n-1]};$('emergency').onclick=()=>{if(confirm('119番の発信画面を開きますか？'))location.href='tel:119'};</script></html>
