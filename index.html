<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家族みまもり メール・SMSテスト</title><style>body{font:18px sans-serif;max-width:480px;margin:auto;padding:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit}button{background:#165db4;color:white;border:0;border-radius:10px}</style><h1>家族みまもり メール・SMSテスト</h1><p>緊急用ではありません。位置情報を登録済みの2人へメール送信します。</p><label>GASウェブアプリURL<input id="url" type="url" value="https://script.google.com/macros/s/AKfycbxVsarErMQQdxDGhyG1zJm3tJaKtZY9EoiRe8yRhne2K-JL_yKQ0fu8VZMnjBHa1zG7JA/exec"></label><label>認証キー<input id="key" type="password" autocomplete="off"></label><button id="gps">1. 現在地を取得</button><p id="status" role="status"></p><form id="form" method="post" target="_blank" rel="noopener"><input type="hidden" name="key" id="secret"><input type="hidden" name="lat" id="lat"><input type="hidden" name="lon" id="lon"><button id="send" disabled>2. 位置情報付きテストメールを送信</button></form><hr><h2>SMSテスト</h2><p>現在地を取得してから、電話番号を入力してください。SMSアプリで送信操作が必要です。</p><label>通知先1の電話番号<input id="phone1" type="tel" autocomplete="off"></label><button type="button" id="sms1">通知先1へのSMSを作成</button><label>通知先2の電話番号<input id="phone2" type="tel" autocomplete="off"></label><button type="button" id="sms2">通知先2へのSMSを作成</button><p id="smsstatus" role="status"></p><script>const $=id=>document.getElementById(id);$('gps').onclick=()=>{$('send').disabled=true;$('status').textContent='取得中…';navigator.geolocation.getCurrentPosition(p=>{$('lat').value=p.coords.latitude;$('lon').value=p.coords.longitude;$('status').textContent='現在地を取得しました';$('send').disabled=false},e=>{$('status').textContent='取得失敗：'+e.code},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};$('form').onsubmit=e=>{const u=$('url').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u)||!$('key').value){e.preventDefault();alert('URLと認証キーを確認してください');return}$('form').action=u;$('secret').value=$('key').value};function sms(n){const phone=$('phone'+n).value.replace(/[\s()-]/g,'');if(!/^\+?[0-9]{8,15}$/.test(phone)){alert('電話番号を確認してください');return}if(!$('lat').value||!$('lon').value){alert('先に現在地を取得してください');return}const body='【家族みまもり・テスト】緊急通知ではありません。現在地：https://www.google.com/maps?q='+$('lat').value+','+$('lon').value;$('smsstatus').textContent='SMSアプリで宛先・本文を確認し、送信してください。受信はこの画面では確認できません。';location.href='sms:'+phone+'?body='+encodeURIComponent(body)}$('sms1').onclick=()=>sms(1);$('sms2').onclick=()=>sms(2);</script></html>
